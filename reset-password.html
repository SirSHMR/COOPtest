<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تغيير كلمة المرور</title>

<!-- نفس الستايل اللي عطيتني إياه -->
<style>
/* نفس الستايل اللي تستخدمه */
body {
  font-family: Poppins, sans-serif;
  background: #f2f5f9;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Box */
.login-box {
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
  width: 320px;
  text-align: center;
  margin-top: -50px;
}

.login-box input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-family: Poppins, sans-serif;
}

.login-box button {
  width: 100%;
  padding: 12px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 10px;
}

.login-box button:hover {
  background: #0056b3;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  display: none;
  font-weight: 500;
}

.message.error {
  background: #ffdddd;
  color: #d60000;
  border-left: 5px solid #d60000;
}

.message.success {
  background: #ddffdd;
  color: #0c8b0c;
  border-left: 5px solid #0c8b0c;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>تغيير كلمة المرور</h2>

  <input id="newPass" type="password" placeholder="كلمة المرور الجديدة" />

  <input id="confirmPass" type="password" placeholder="تأكيد كلمة المرور" />
  
  <button id="resetBtn">تغيير كلمة المرور</button>

  <div id="msg" class="message"></div>
</div>


<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";

const supabase = createClient(
  "https://fucddnhmxhskmzmhmzyw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1Y2RkbmhteGhza216bWhtenl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0NzcyMjUsImV4cCI6MjA3OTA1MzIyNX0.TvLGcHwQGNWxfBb54A3Z-3s9bFEHiLPBBHPzqOuoqeo"
);

const msg = document.getElementById("msg");
const button = document.getElementById("resetBtn");

function showMessage(text, type) {
  msg.innerText = text;
  msg.className = "message " + type;
  msg.style.display = "block";
}

// --- تفعيل جلسة الاستعادة ---
async function startRecoverySession() {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);

  const code = params.get("code");
  const type = params.get("type");

  if (!code || type !== "recovery") {
    showMessage("الرابط غير صالح أو منتهي.", "error");
    return null;
  }

  const { data, error } = await supabase.auth.exchangeCodeForSession(code);

  if (error) {
    showMessage("الرابط غير صالح أو منتهي.", "error");
    return null;
  }

  return data.session;
}

let activeSession = await startRecoverySession();

button.onclick = async () => {
  const newPass = document.getElementById("newPass").value.trim();
  const confirmPass = document.getElementById("confirmPass").value.trim();

  if (!newPass || !confirmPass) {
    return showMessage("يرجى إدخال كلمة المرور.", "error");
  }

  if (newPass !== confirmPass) {
    return showMessage("كلمة المرور غير متطابقة!", "error");
  }

  if (!activeSession) {
    return showMessage("الرابط غير صالح، اطلب إعادة تعيين كلمة المرور.", "error");
  }

  const { error } = await supabase.auth.updateUser({
    password: newPass
  });

  if (error) {
    showMessage("خطأ: " + error.message, "error");
  } else {
    showMessage("تم تغيير كلمة المرور بنجاح!", "success");
    setTimeout(() => window.location.href = "index.html", 2000);
  }
};
</script>

</body>
</html>
