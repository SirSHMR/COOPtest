<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تغيير كلمة المرور</title>

<!-- نفس الستايل -->
<style>
body {
  font-family: Poppins, sans-serif;
  background: #f2f5f9;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-box {
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
  width: 320px;
  text-align: center;
  margin-top: -50px;
}
.login-box input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-family: Poppins, sans-serif;
}
.login-box button {
  width: 100%;
  padding: 12px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 10px;
}
.login-box button:hover {
  background: #0056b3;
}
.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  display: none;
  font-weight: 500;
}
.message.error {
  background: #ffdddd;
  color: #d60000;
  border-left: 5px solid #d60000;
}
.message.success {
  background: #ddffdd;
  color: #0c8b0c;
  border-left: 5px solid #0c8b0c;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>تغيير كلمة المرور</h2>

  <input id="newPass" type="password" placeholder="كلمة المرور الجديدة" />
  <input id="confirmPass" type="password" placeholder="تأكيد كلمة المرور" />
  
  <button id="resetBtn">تغيير كلمة المرور</button>

  <div id="msg" class="message"></div>
</div>

<!-- سكربت Supabase -->
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";

// ضع هنا رابط المشروع والمفتاح العمومي
const supabase = createClient(
  "https://fucddnhmxhskmzmhmzyw.supabase.co",
  "PUBLIC_ANON_KEY_HERE"
);

const msg = document.getElementById("msg");
const button = document.getElementById("resetBtn");

function showMessage(text, type) {
  msg.innerText = text;
  msg.className = "message " + type;
  msg.style.display = "block";
}

// قراءة access_token مباشرة من الـ hash
const hashParams = new URLSearchParams(window.location.hash.substring(1));
const access_token = hashParams.get("access_token");
const type = hashParams.get("type");

if (!access_token || type !== "recovery") {
  showMessage("الرابط غير صالح أو منتهي.", "error");
} else {
  // تفعيل الجلسة مؤقتاً
  await supabase.auth.setSession({ access_token });

  button.onclick = async () => {
    const newPass = document.getElementById("newPass").value.trim();
    const confirmPass = document.getElementById("confirmPass").value.trim();

    if (!newPass || !confirmPass) return showMessage("يرجى إدخال كلمة المرور.", "error");
    if (newPass !== confirmPass) return showMessage("كلمة المرور غير متطابقة!", "error");

    const { error } = await supabase.auth.updateUser({ password: newPass });

    if (error) showMessage("خطأ: " + error.message, "error");
    else {
      showMessage("تم تغيير كلمة المرور بنجاح!", "success");
      setTimeout(() => window.location.href = "index.html", 2000);
    }
  };
}
</script>

</body>
</html>
