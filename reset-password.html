<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تغيير كلمة المرور</title>
  <style>
    body { 
      font-family: Tahoma; background:#eef1f5; 
      display:flex; align-items:center; justify-content:center; height:100vh;
    }
    .box {
      width: 350px; background:#fff; padding:25px;
      border-radius:12px; text-align:center;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width:90%; padding:10px; margin-top:10px;
      border-radius:8px; border:1px solid #ccc;
      font-size:15px;
    }
    button { background:#4CAF50; color:white; border:none; cursor:pointer; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="box">
  <h3>تغيير كلمة المرور</h3>
  <p>ادخل كلمة المرور الجديدة</p>

  <input type="password" id="newpass" placeholder="كلمة المرور الجديدة">
  <button onclick="changePassword()">تغيير</button>

  <p id="msg"></p>
</div>

<script>

const supabase = supabase.createClient(
  "https://fucddnhmxhskmzmhmzyw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1Y2RkbmhteGhza216bWhtenl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0NzcyMjUsImV4cCI6MjA3OTA1MzIyNX0.TvLGcHwQGNWxfBb54A3Z-3s9bFEHiLPBBHPzqOuoqeo"
);

// Supabase يجهز session بعد الضغط على رابط الايميل
async function changePassword() {
  const newPassword = document.getElementById("newpass").value;

  const { data, error } = await supabase.auth.updateUser({
    password: newPassword
  });

  if (error) {
    document.getElementById("msg").innerText = "خطأ: " + error.message;
  } else {
    document.getElementById("msg").innerText = "تم تغيير كلمة المرور بنجاح!";
    
    // تحويل المستخدم لصفحة تسجيل الدخول
    setTimeout(() => {
      window.location.href = "/login.html";
    }, 2000);
  }
}

</script>

</body>
</html>
