<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة رمز التشفير</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .pin-management {
      max-width: 500px;
      margin: 50px auto;
      padding: 30px;
    }
    
    .pin-form {
      text-align: right;
    }
    
    .pin-form label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
      color: #333;
    }
    
    .pin-form input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
    }
    
    .pin-actions {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }
    
    .pin-actions button {
      flex: 1;
      padding: 12px;
    }
    
    .security-note {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="container pin-management">
      <h2>إدارة رمز التشفير (PIN)</h2>
      
      <div class="security-note">
        <strong>معلومات هامة:</strong>
        <ul>
          <li>رمز التشفير يستخدم لتأمين ملفاتك</li>
          <li>يجب أن تتذكر الرمز لأنه غير مخزن بأي مكان آخر</li>
          <li>إذا نسيت الرمز، لن تتمكن من فتح ملفاتك القديمة</li>
          <li>الرمز يجب أن يكون 4-6 أرقام</li>
        </ul>
      </div>
      
      <div id="messageBox" class="msgBox"></div>
      
      <div class="pin-form">
        <label for="currentPin">الرمز الحالي:</label>
        <input type="password" id="currentPin" placeholder="أدخل الرمز الحالي">
        
        <label for="newPin">الرمز الجديد (4-6 أرقام):</label>
        <input type="password" id="newPin" placeholder="أدخل الرمز الجديد">
        
        <label for="confirmPin">تأكيد الرمز الجديد:</label>
        <input type="password" id="confirmPin" placeholder="أكد الرمز الجديد">
        
        <div class="pin-actions">
          <button id="updatePinBtn" style="background: #28a745;">تحديث الرمز</button>
          <button onclick="window.location.href='dashboard.html'" style="background: #6c757d;">العودة للرئيسية</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // إعداد Supabase
    const SUPABASE_URL = "https://fucddnhmxhskmzmhmzyw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1Y2RkbmhteGhza216bWhtenl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0NzcyMjUsImV4cCI6MjA3OTA1MzIyNX0.TvLGcHwQGNWxfBb54A3Z-3s9bFEHiLPBBHPzqOuoqeo";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // عرض الرسائل
    function showMessage(text, type = "error") {
      const msgBox = document.getElementById("messageBox");
      msgBox.textContent = text;
      msgBox.className = `msgBox ${type === 'error' ? 'errorMsg' : 'successMsg'}`;
      msgBox.style.display = 'block';
      
      if (type === 'success') {
        setTimeout(() => msgBox.style.display = 'none', 3000);
      }
    }
    
    // تحديث PIN
    async function updatePIN() {
      const currentPin = document.getElementById("currentPin").value;
      const newPin = document.getElementById("newPin").value;
      const confirmPin = document.getElementById("confirmPin").value;
      
      if (!currentPin || !newPin || !confirmPin) {
        showMessage("جميع الحقول مطلوبة");
        return;
      }
      
      if (newPin.length < 4) {
        showMessage("يجب أن يكون الرمز الجديد 4 أرقام على الأقل");
        return;
      }
      
      if (newPin !== confirmPin) {
        showMessage("الرمز الجديد وتأكيد الرمز غير متطابقين");
        return;
      }
      
      if (newPin === currentPin) {
        showMessage("الرمز الجديد يجب أن يختلف عن الرمز الحالي");
        return;
      }
      
      const { data: { user } } = await supabase.auth.getUser();
      
      if (!user) {
        showMessage("يجب تسجيل الدخول أولاً");
        setTimeout(() => window.location.href = "index.html", 2000);
        return;
      }
      
      // التحقق من الرمز الحالي
      const { data: employee, error: fetchError } = await supabase
        .from("employees")
        .select("encryption_pin")
        .eq("id", user.id)
        .single();
      
      if (fetchError) {
        showMessage("خطأ في جلب بيانات الموظف");
        return;
      }
      
      if (!employee || employee.encryption_pin !== currentPin) {
        showMessage("الرمز الحالي غير صحيح");
        return;
      }
      
      // تحديث الرمز
      const { error } = await supabase
        .from("employees")
        .update({ encryption_pin: newPin })
        .eq("id", user.id);
      
      if (error) {
        showMessage("خطأ في تحديث الرمز: " + error.message);
      } else {
        showMessage("تم تحديث الرمز بنجاح! سيتم توجيهك إلى الصفحة الرئيسية...", "success");
        setTimeout(() => window.location.href = "dashboard.html", 2000);
      }
    }
    
    // عند تحميل الصفحة
    document.addEventListener("DOMContentLoaded", async () => {
      // التحقق من تسجيل الدخول
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      
      // إضافة مستمع الحدث للزر
      document.getElementById("updatePinBtn").addEventListener("click", updatePIN);
      
      // إضافة مستمعي الأحداث لحقول الإدخال
      document.getElementById("currentPin").addEventListener("keypress", e => {
        if (e.key === "Enter") updatePIN();
      });
      
      document.getElementById("newPin").addEventListener("keypress", e => {
        if (e.key === "Enter") updatePIN();
      });
      
      document.getElementById("confirmPin").addEventListener("keypress", e => {
        if (e.key === "Enter") updatePIN();
      });
    });
  </script>
</body>
</html>
