<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>نسيت كلمة المرور</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h3>نسيت كلمة المرور</h3>
  <input id="email" type="email" placeholder="أدخل البريد">
  <button onclick="sendReset()">إرسال رابط إعادة التعيين</button>
  <p id="msg"></p>

  <script>
    const supabase = supabase.createClient(
      "https://YOUR-SUPABASE-PROJECT.supabase.co",
      "YOUR_SUPABASE_ANON_KEY"
    );

    async function sendReset() {
      const email = document.getElementById("email").value.trim();
      if (!email) return document.getElementById("msg").innerText = "أدخل البريد أولاً.";

      const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: "https://your-site.com/reset-password.html"
      });

      if (error) {
        document.getElementById("msg").innerText = "خطأ: " + error.message;
      } else {
        document.getElementById("msg").innerText = "تم إرسال رابط إعادة التعيين. تفقد بريدك.";
      }
    }
  </script>
</body>
</html>
