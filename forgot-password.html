<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نسيت كلمة المرور</title>
  <style>
    body { 
      font-family: Tahoma; background:#f7f7f7; 
      display:flex; align-items:center; justify-content:center; height:100vh; 
    }
    .box {
      width: 350px; background: #fff; padding: 25px;
      border-radius: 12px; box-shadow:0 0 10px rgba(0,0,0,0.1);
      text-align:center;
    }
    input, button {
      width:90%; padding:10px; margin-top:10px; border-radius:8px;
      border:1px solid #ccc; font-size:15px;
    }
    button {
      background:#4a72ff; color:white; cursor:pointer; border:none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="box">
  <h3>نسيت كلمة المرور</h3>
  <p>ادخل بريدك الإلكتروني لإرسال رابط إعادة التعيين</p>

  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <button onclick="sendReset()">إرسال رابط إعادة التعيين</button>

  <p id="msg"></p>
</div>

<script>

// إعداد Supabase
const supabase = supabase.createClient(
  "https://fucddnhmxhskmzmhmzyw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1Y2RkbmhteGhza216bWhtenl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0NzcyMjUsImV4cCI6MjA3OTA1MzIyNX0.TvLGcHwQGNWxfBb54A3Z-3s9bFEHiLPBBHPzqOuoqeo"
);

async function sendReset() {
  const email = document.getElementById("email").value;

  const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: "https://your-website.com/reset-password.html"
  });

  if (error) {
    document.getElementById("msg").innerText = "خطأ: " + error.message;
  } else {
    document.getElementById("msg").innerText = "تم إرسال الرابط إلى بريدك!";
  }
}

</script>

</body>
</html>
