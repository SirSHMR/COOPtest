<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure File System - Login</title>
  
</head>
  <style>
    .login-box {
      width: 300px;
      margin: 100px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .login-box input {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 8px;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .message {
      display: none;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 5px;
    }
    .message.error { background: #f8d7da; color: #721c24; }
    .message.success { background: #d4edda; color: #155724; }
  </style>
<body>

  <div class="login-box">
    <h2>Employee Login</h2>
    <div id="message" class="message"></div>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="loginBtn">Login</button>
  </div>

  <script type="module">
    // === Supabase setup ===
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/supabase.min.js';

    const SUPABASE_URL = "https://fucddnhmxhskmzmhmzyw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1Y2RkbmhteGhza216bWhtenl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0NzcyMjUsImV4cCI6MjA3OTA1MzIyNX0.TvLGcHwQGNWxfBb54A3Z-3s9bFEHiLPBBHPzqOuoqeo";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type = "error") {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = "message " + type;
      msg.style.display = "block";
    }

    // === Login function ===
    async function loginUser() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        showMessage("Please enter both fields", "error");
        return;
      }

      // تسجيل الدخول عبر Supabase Auth
      const { data: loginData, error: loginError } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (loginError) {
        showMessage("Invalid email or password", "error");
        return;
      }

      const user = loginData.user;

      // جلب بيانات الـ profile من جدول profiles
      const { data: profile, error: profileError } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();

      if (profileError) {
        showMessage("Error fetching profile", "error");
        return;
      }

      showMessage(`Login successful! Welcome, ${profile.username}`, "success");

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);
    }

    document.getElementById("loginBtn").addEventListener("click", loginUser);
  </script>

</body>
</html>
