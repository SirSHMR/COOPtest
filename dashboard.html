<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encryption Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard-container">
    <h2>Encryption / Decryption</h2>

    <input type="file" id="fileInput" />
    <br /><br />

    <button id="encryptBtn">Encrypt File</button>
    <button id="decryptBtn">Decrypt File</button>

    <p id="message" class="message"></p>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const encryptBtn = document.getElementById("encryptBtn");
    const decryptBtn = document.getElementById("decryptBtn");
    const message = document.getElementById("message");

    let encryptedData = null;
    let key = null;

    // 🔐 تشفير الملف
    encryptBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        message.style.color = "red";
        message.innerText = "⚠️ Please select a file to encrypt.";
        return;
      }

      const arrayBuffer = await file.arrayBuffer();
      key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, arrayBuffer);

      encryptedData = { encrypted, iv };

      message.style.color = "green";
      message.innerText = "✅ File encrypted successfully!";
    });

    // 🔓 فك التشفير
    decryptBtn.addEventListener("click", async () => {
      if (!encryptedData || !key) {
        message.style.color = "red";
        message.innerText = "⚠️ No encrypted file found to decrypt.";
        return;
      }

      try {
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: encryptedData.iv },
          key,
          encryptedData.encrypted
        );

        const blob = new Blob([decrypted]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "decrypted_file";
        a.click();

        message.style.color = "green";
        message.innerText = "✅ File decrypted and downloaded!";
      } catch (err) {
        message.style.color = "red";
        message.innerText = "❌ Error decrypting file. Key may be incorrect.";
        console.error(err);
      }
    });
  </script>
</body>
</html>
