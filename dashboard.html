<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم الموظف | نظام الملفات الآمن</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard-container">
    
    <!-- مربع إرسال الملف -->
    <div class="container">
      <h2>تشفير وإرسال ملف</h2>
      <div id="messageBox" class="msgBox"></div>
      
      <input type="file" id="fileInput">
      
      <label for="employeeSelect">إرسال إلى الموظفين:</label>
      
      <!-- خيار إرسال لجميع الموظفين -->
      <div class="select-all-container">
        <label>
          <input type="checkbox" id="selectAllEmployees">
          إرسال إلى جميع الموظفين
        </label>
      </div>
      
      <!-- قائمة الموظفين -->
      <div id="employeesList" class="employees-list">
        <!-- سيتم تعبئتها بواسطة JavaScript -->
      </div>
      
      <button id="encryptBtn">تشفير وإرسال</button>
    </div>

    <!-- مربع المستندات المستلمة -->
    <div class="container">
      <h2>المستندات المستلمة</h2>
      <div id="receivedList" class="received-files">
        <!-- سيتم تعبئتها -->
      </div>
    </div>

    <div class="dashboard-actions">
      <button onclick="window.location.href='pin-management.html'" id="pinBtn">إدارة رمز التشفير</button>
      <button id="logoutBtn">تسجيل الخروج</button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="dashboard.js"></script>
</body>
</html>
