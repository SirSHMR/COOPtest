<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard-container">
    
    <!-- مربع إرسال الملف -->
    <div class="container">
      <h2>Encrypt & Send File</h2>
      <div id="messageBox" class="msgBox"></div>
      
      <input type="file" id="fileInput">
      
      <label for="employeeSelect">Send to Employee:</label>
      <select id="employeeSelect">
        <option value="">Select Employee</option>
      </select>
      
      <button id="encryptBtn">Encrypt & Send</button>
    </div>

    <!-- مربع المستندات المستلمة -->
    <div class="container">
      <h2>Received Documents</h2>
      <div id="receivedList" class="received-files">
        <!-- سيتم تعبئته -->
      </div>
    </div>

    <button id="logoutBtn" style="width: 200px; margin-top: 20px;">Logout</button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="dashboard.js"></script>
</body>
</html>
