<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <style>
    body { font-family: Poppins, sans-serif; background-color: #f2f5f9; text-align: center; padding: 50px; }
    .box { background: white; padding: 30px; border-radius: 15px; width: 400px; margin: auto; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    button { margin: 10px; padding: 10px 20px; border: none; border-radius: 10px; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Welcome to the Secure File System</h2>
    <button>Encrypt File</button>
    <button>Decrypt File</button>
  </div>
</body>
</html>
